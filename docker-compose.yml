services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-banyu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-banyu}
      POSTGRES_DB: ${POSTGRES_DB:-banyu}
    # 只绑定回环地址：服务器上数据库不对外暴露，本地开发仍可直连
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - banyu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-banyu} -d ${POSTGRES_DB:-banyu}"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # 容器内固定监听 8787；改端口只改 .env 的 PORT（作用于宿主机侧映射）
      PORT: 8787
      # 容器网络内数据库主机名是 db，覆盖 .env 里指向 localhost 的连接串
      DATABASE_URL: postgresql://${POSTGRES_USER:-banyu}:${POSTGRES_PASSWORD:-banyu}@db:5432/${POSTGRES_DB:-banyu}
    ports:
      - "${PORT:-8787}:8787"

volumes:
  banyu_pgdata:
